<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}面经猎手{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css?v=5">
    <script>
    // 首屏前应用已保存主题，避免闪烁
    (function () {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
    })();
    </script>
</head>
<body>

<!-- ===== SVG 图标库（Feather 细线风，stroke 继承 currentColor） ===== -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
<symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
<symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></symbol>

<symbol id="i-cookie" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10 4 4 0 0 1-5-5 4 4 0 0 1-5-5"/><circle cx="8.5" cy="10.5" r="1.2"/><circle cx="12.5" cy="15.5" r="1.2"/><circle cx="15.5" cy="11.5" r="1.2"/></symbol>
<symbol id="i-server" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>

<symbol id="i-activity" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></symbol>
<symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></symbol>

<symbol id="i-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></symbol>
<symbol id="i-terminal" viewBox="0 0 24 24"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></symbol>
<symbol id="i-wand" viewBox="0 0 24 24"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9h2"/><path d="M20 9h2"/><path d="M17.8 11.8 19 13"/><path d="M15 9h.01"/><path d="M17.8 6.2 19 5"/><path d="m3 21 9-9"/><path d="M12.2 6.2 11 5"/></symbol>
<symbol id="i-rotate" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
<symbol id="i-ff" viewBox="0 0 24 24"><polygon points="13 19 2 12 13 5 13 19"/><polygon points="23 19 12 12 23 5 23 19"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></symbol>
<symbol id="i-skip" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
<symbol id="i-wand" viewBox="0 0 24 24"><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M17.8 6.2 19 5M3 21l9-9M12.2 6.2 11 5"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6.7 3L3 13"/></symbol>
<symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"/><line x1="10" y1="12" x2="14" y2="12"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
<symbol id="i-chev-left" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></symbol>
<symbol id="i-chev-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
<symbol id="i-chev-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
</defs>
</svg>

    <header class="navbar">
        <div class="container nav-inner">
            <a href="/" class="brand">
                <span class="brand-mark"><svg class="icon"><use href="#i-search"/></svg></span>
                <span>面经猎手</span>
                <span class="brand-badge">NOWCODER</span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                    <svg class="icon"><use href="#i-key"/></svg><span>关键词</span>
                </a>
                <a href="/interviews" class="nav-link {% if request.url.path.startswith('/interviews') %}active{% endif %}">
                    <svg class="icon"><use href="#i-book"/></svg><span>面经库</span>
                </a>
                <a href="/cookie" class="nav-link {% if request.url.path == '/cookie' %}active{% endif %}">
                    <svg class="icon"><use href="#i-cookie"/></svg><span>Cookie</span>
                </a>
                <a href="/tasks" class="nav-link {% if request.url.path == '/tasks' %}active{% endif %}">
                    <svg class="icon"><use href="#i-list"/></svg><span>任务日志</span>
                </a>
                <div class="nav-dropdown {% if request.url.path.startswith('/clean') %}active{% endif %}">
                    <span class="nav-link nav-dropdown-toggle" tabindex="0">
                        <svg class="icon"><use href="#i-wand"/></svg><span>数据清洗</span>
                        <svg class="icon nav-caret"><use href="#i-chev-down"/></svg>
                    </span>
                    <div class="nav-menu">
                        <a href="/clean" class="nav-menu-item {% if request.url.path == '/clean' %}active{% endif %}">
                            <svg class="icon"><use href="#i-wand"/></svg><span>数据清洗</span>
                        </a>
                        <a href="/clean/archive" class="nav-menu-item {% if request.url.path == '/clean/archive' %}active{% endif %}">
                            <svg class="icon"><use href="#i-archive"/></svg><span>清洗归档</span>
                        </a>
                    </div>
                </div>
            </nav>
            <button id="theme-toggle" class="btn btn-ghost btn-icon theme-toggle" type="button"
                    title="切换白天 / 黑夜主题" aria-label="切换主题">
                <svg class="icon icon-sun"><use href="#i-sun"/></svg>
                <svg class="icon icon-moon"><use href="#i-moon"/></svg>
            </button>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer-inner">
            <span class="foot-brand"><svg class="icon"><use href="#i-terminal"/></svg>面经猎手</span>
            <span class="foot-sep">·</span>
            <span>数据源 牛客网</span>
            <span class="foot-sep">·</span>
            <span>数据仅存于本机</span>
        </div>
    </footer>

    <!-- 全局站内弹窗（替代原生 confirm/alert，不暴露站点地址） -->
    <div id="ui-dialog" class="modal hidden">
        <div class="modal-overlay" data-ui-cancel></div>
        <div class="modal-content ui-dialog" role="dialog" aria-modal="true" aria-labelledby="ui-dialog-title">
            <div class="ui-dialog-title">
                <span id="ui-dialog-icon"></span>
                <span id="ui-dialog-title">提示</span>
            </div>
            <div class="ui-dialog-msg" id="ui-dialog-msg"></div>
            <div class="ui-dialog-actions">
                <button type="button" class="btn btn-ghost" id="ui-dialog-cancel">取消</button>
                <button type="button" class="btn" id="ui-dialog-ok">确认</button>
            </div>
        </div>
    </div>

    <script>
    // 主题切换按钮
    document.getElementById('theme-toggle').addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var next = cur === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    });

    // ===== 全局确认/提示弹窗，返回 Promise；不使用浏览器原生 confirm/alert =====
    (function () {
        const dlg = document.getElementById('ui-dialog');
        const titleEl = document.getElementById('ui-dialog-title');
        const iconEl = document.getElementById('ui-dialog-icon');
        const msgEl = document.getElementById('ui-dialog-msg');
        const okBtn = document.getElementById('ui-dialog-ok');
        const cancelBtn = document.getElementById('ui-dialog-cancel');
        let resolver = null;
        let lastFocused = null;

        function close(result) {
            dlg.classList.add('hidden');
            document.removeEventListener('keydown', onKey);
            okBtn.className = 'btn';
            okBtn.textContent = '确认';
            if (resolver) { resolver(result); resolver = null; }
            if (lastFocused) { lastFocused.focus(); lastFocused = null; }
        }
        function onKey(e) { if (e.key === 'Escape') { e.preventDefault(); close(false); } }

        function open({title = '提示', message = '', okText = '确认', cancelText = '取消',
                       danger = false, showCancel = true, iconHref = '#i-info'}) {
            lastFocused = document.activeElement;
            titleEl.textContent = title;
            msgEl.textContent = message;       // textContent，防 XSS
            msgEl.style.whiteSpace = 'pre-wrap';
            iconEl.innerHTML = `<svg class="icon"><use href="${iconHref}"/></svg>`;
            iconEl.style.color = danger ? 'var(--danger)' : 'var(--info)';
            okBtn.textContent = okText;
            okBtn.className = 'btn ' + (danger ? 'btn-danger' : 'btn-primary');
            cancelBtn.style.display = showCancel ? '' : 'none';
            cancelBtn.textContent = cancelText;
            dlg.classList.remove('hidden');
            document.addEventListener('keydown', onKey);
            setTimeout(() => (showCancel ? cancelBtn : okBtn).focus(), 30);
            return new Promise(res => { resolver = res; });
        }

        okBtn.addEventListener('click', () => close(true));
        cancelBtn.addEventListener('click', () => close(false));
        dlg.addEventListener('click', e => { if (e.target.hasAttribute('data-ui-cancel')) close(false); });

        window.uiConfirm = opts => open(Object.assign({showCancel: true}, opts));
        window.uiAlert = opts => open(Object.assign(
            {showCancel: false, okText: '我知道了', iconHref: '#i-info'},
            typeof opts === 'string' ? {message: opts} : opts
        ));
    })();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
